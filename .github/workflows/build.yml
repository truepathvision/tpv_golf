name: Build TPV_Golf

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: TPV_Golf-macOS
          - os: windows-latest
            artifact: TPV_Golf-Windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller tpv_golf.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/TPV_Golf/
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: TPV_Golf-macOS
          path: TPV_Golf-macOS

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: TPV_Golf-Windows
          path: TPV_Golf-Windows

      - name: Create archives
        run: |
          cd TPV_Golf-macOS && zip -r ../TPV_Golf-macOS.zip . && cd ..
          cd TPV_Golf-Windows && zip -r ../TPV_Golf-Windows.zip . && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TPV_Golf-macOS.zip
            TPV_Golf-Windows.zip
          generate_release_notes: true
